<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PatentScout - Prior-Art Search Agent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PatentScout</h1>
        <p>Prior-Art Search Agent</p>
    </header>

    <main>
        <h2>Discover Existing Innovations</h2>

        <p>
            Search for existing patents related to your invention idea.
        </p>

        <input
            type="text"
            id="searchInput"
            placeholder="Enter your invention idea..."
        >

        <button type="button" id="searchButton">Search Patents</button>

        <button type="button" id="clearButton">Clear Search</button>

        <div id="results">
            <p>Your search results will appear here.</p>
        </div>
    </main>

    <footer>
        <p>PatentScout | College Project 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
